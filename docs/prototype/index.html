<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MeritAI 手机样稿</title>
<meta name="description" content="MeritAI 手机版可点击原型：首页、新建项目与 AI 拆任务、选任务包与交证据、排行榜、徽章与通知。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=DM+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;700;900&display=swap">
<style>
:root {
  --font-display: "Bricolage Grotesque", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --font-body: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --font-mono: "DM Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;

  --backdrop: #E7E5F1;
  --bezel: #1E1B2E;
  --paper: #F5F4FA;
  --card: #FFFFFF;
  --card-2: #EFEDF7;
  --ink: #1E1B2E;
  --ink-2: #4A4660;
  --muted: #625D76;
  --line: #E1DEEC;
  --grape: #6246EA;
  --grape-press: #4429C4;
  --grape-soft: #ECE8FF;
  --grape-text: #4E33D2;
  --on-grape: #FFFFFF;

  --lemon: #FFD84A;
  --gum: #FF86BA;
  --mint: #3FD89B;
  --sky: #5AAEFF;
  --tang: #FF9E47;
  --lilac: #B794FF;
  --on-hl: #1E1B2E;
  --hl-strength: 100%;

  --good: #0B7A4C;
  --good-soft: #DDF6EA;
  --warn: #8F5100;
  --warn-soft: #FFEFD2;
  --bad: #B8223C;
  --bad-soft: #FFE4E9;
  --on-bad: #FFFFFF;
  --on-ink-good: #3FD89B;

  --shadow: 0 1px 0 rgba(30, 27, 46, 0.04), 0 10px 28px -16px rgba(30, 27, 46, 0.28);
  --phone-shadow: 0 40px 80px -40px rgba(44, 30, 120, 0.45);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --backdrop: #0D0B14;
    --bezel: #2A2638;
    --paper: #15131E;
    --card: #1F1C2B;
    --card-2: #2A2639;
    --ink: #F3F1FA;
    --ink-2: #CFCAE3;
    --muted: #A7A2BE;
    --line: #332F46;
    --grape: #6A52F0;
    --grape-press: #4A33C8;
    --grape-soft: #2D2652;
    --grape-text: #BCAFFF;
    --on-grape: #FFFFFF;
    --lemon: #F2C94C;
    --gum: #F07AAE;
    --mint: #36C98E;
    --sky: #4F9EF0;
    --tang: #F0913E;
    --lilac: #A987F5;
    --hl-strength: 48%;
    --good: #52D69B;
    --good-soft: #173A2C;
    --warn: #F4B35A;
    --warn-soft: #3A2C14;
    --bad: #FF7A8F;
    --bad-soft: #401B24;
    --on-bad: #1E1B2E;
    --on-ink-good: #0B7A4C;
    --shadow: 0 1px 0 rgba(0, 0, 0, 0.2), 0 12px 28px -16px rgba(0, 0, 0, 0.7);
    --phone-shadow: 0 40px 80px -40px rgba(0, 0, 0, 0.9);
  }
}
:root[data-theme="dark"] {
  --backdrop: #0D0B14;
  --bezel: #2A2638;
  --paper: #15131E;
  --card: #1F1C2B;
  --card-2: #2A2639;
  --ink: #F3F1FA;
  --ink-2: #CFCAE3;
  --muted: #A7A2BE;
  --line: #332F46;
  --grape: #6A52F0;
  --grape-press: #4A33C8;
  --grape-soft: #2D2652;
  --grape-text: #BCAFFF;
  --on-grape: #FFFFFF;
  --lemon: #F2C94C;
  --gum: #F07AAE;
  --mint: #36C98E;
  --sky: #4F9EF0;
  --tang: #F0913E;
  --lilac: #A987F5;
  --hl-strength: 48%;
  --good: #52D69B;
  --good-soft: #173A2C;
  --warn: #F4B35A;
  --warn-soft: #3A2C14;
  --bad: #FF7A8F;
  --bad-soft: #401B24;
  --on-bad: #1E1B2E;
  --on-ink-good: #0B7A4C;
  --shadow: 0 1px 0 rgba(0, 0, 0, 0.2), 0 12px 28px -16px rgba(0, 0, 0, 0.7);
  --phone-shadow: 0 40px 80px -40px rgba(0, 0, 0, 0.9);
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--backdrop);
  color: var(--ink);
  font: 15px/1.55 var(--font-body);
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--grape); outline-offset: 2px; border-radius: 8px; }

/* ── Stage: map + phone ─────────────────────────────────────────── */
.stage {
  min-height: 100%;
  display: grid;
  grid-template-columns: minmax(240px, 300px) auto;
  justify-content: center;
  align-items: start;
  gap: 56px;
  padding-block: 40px;
  padding-inline: 24px;
}
.map { position: sticky; top: 40px; display: flex; flex-direction: column; gap: 20px; max-width: 300px; }
.map-head h2 { margin: 0; font: 800 26px/1.15 var(--font-display); letter-spacing: -0.02em; text-wrap: balance; }
.map-head p { margin: 8px 0 0; color: var(--muted); font-size: 13.5px; }
.map-group { display: flex; flex-direction: column; gap: 2px; }
.map-group h3 { margin: 0 0 6px; font-size: 12px; font-weight: 700; letter-spacing: 0.06em; color: var(--muted); }
.map-link { display: flex; align-items: baseline; gap: 10px; width: 100%; text-align: left; border: 0; background: transparent; padding: 7px 10px; border-radius: 10px; cursor: pointer; }
.map-link:hover { background: var(--card); }
.map-link.on { background: var(--card); box-shadow: var(--shadow); }
.map-link b { font-weight: 700; font-size: 14px; color: var(--ink); }
.map-link .hint-t { color: var(--muted); font-size: 12px; }
.map-link .n { font: 500 11px var(--font-mono); color: var(--muted); min-width: 14px; }
.map-note { font-size: 12px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 14px; margin: 0; }
.map-close { display: none; }
.map-fab {
  display: none;
  position: fixed;
  z-index: 60;
  top: 42%;
  right: 0;
  align-items: center;
  gap: 6px;
  border: 0;
  border-radius: 12px 0 0 12px;
  padding: 12px 6px;
  writing-mode: vertical-rl;
  letter-spacing: 0.2em;
  background: var(--ink);
  color: var(--paper);
  font-size: 12.5px;
  font-weight: 700;
  box-shadow: var(--shadow);
  cursor: pointer;
}

.device { display: flex; justify-content: center; }
.phone {
  position: relative;
  width: 390px;
  height: 844px;
  border-radius: 52px;
  border: 11px solid var(--bezel);
  background: var(--paper);
  box-shadow: var(--phone-shadow);
  overflow: hidden;
  display: flex;
  flex-direction: column;
}
.statusbar { flex: none; height: 44px; display: flex; align-items: center; justify-content: space-between; padding: 0 26px 0 30px; font: 700 14px var(--font-display); font-variant-numeric: tabular-nums; }
.statusbar .icons { display: flex; gap: 6px; align-items: center; }
.statusbar svg { display: block; }
.home-bar { position: absolute; bottom: 7px; left: 50%; width: 120px; height: 5px; margin-left: -60px; border-radius: 3px; background: var(--ink); opacity: 0.8; pointer-events: none; }

@media (max-width: 899px) {
  .stage { display: block; padding: 0; height: 100%; }
  .map { display: none; }
  .map.open { display: flex; position: fixed; inset: 0; z-index: 70; max-width: none; overflow-y: auto; background: var(--paper); padding: calc(16px + env(safe-area-inset-top, 0px)) 20px 32px; }
  .map-close { display: inline-flex; align-self: flex-end; border: 0; border-radius: 999px; padding: 6px 14px; background: var(--card-2); font-weight: 700; font-size: 13px; cursor: pointer; }
  .map-fab { display: flex; }
  .device { height: 100%; }
  .phone { width: 100%; height: 100%; border: 0; border-radius: 0; box-shadow: none; }
  .statusbar, .home-bar { display: none; }
}

/* ── App chrome ─────────────────────────────────────────────────── */
.screen { flex: 1; overflow-y: auto; overscroll-behavior: contain; padding: 4px 18px 28px; display: flex; flex-direction: column; gap: 18px; }
.screen::-webkit-scrollbar { width: 0; }
.screen > * { flex-shrink: 0; } /* long screens scroll; never squash lists that clip overflow */
.tabbar { flex: none; display: grid; grid-template-columns: repeat(4, 1fr); padding: 6px 8px calc(18px + env(safe-area-inset-bottom, 0px)); background: var(--card); border-top: 1px solid var(--line); }
.tab { display: flex; flex-direction: column; align-items: center; gap: 2px; border: 0; background: none; padding: 4px 0; font-size: 11px; font-weight: 600; color: var(--muted); cursor: pointer; position: relative; }
.tab .ic { display: grid; place-items: center; width: 48px; height: 30px; border-radius: 999px; transition: background 0.2s; }
.tab.on { color: var(--grape-text); }
.tab.on .ic { background: var(--grape-soft); }
.tab .dot { position: absolute; top: 3px; left: calc(50% + 9px); min-width: 17px; height: 17px; padding: 0 5px; border-radius: 999px; background: var(--bad); color: var(--on-bad); font: 700 10px/17px var(--font-display); }

.appbar { position: sticky; top: -4px; z-index: 5; margin: -4px -18px 0; padding: 8px 12px; display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; background: color-mix(in oklab, var(--paper) 88%, transparent); backdrop-filter: blur(10px); }
.appbar h2 { margin: 0; text-align: center; font-size: 16px; font-weight: 700; }
.appbar h2:focus { outline: none; }
.appbar .sub { display: block; font-size: 11.5px; font-weight: 500; color: var(--muted); }
.icon-btn { display: grid; place-items: center; width: 40px; height: 40px; border: 0; border-radius: 12px; background: transparent; cursor: pointer; color: var(--ink); }
.icon-btn:hover { background: var(--card-2); }

.top { display: flex; align-items: center; justify-content: space-between; padding-top: 6px; }
.brand { display: flex; align-items: center; gap: 8px; font: 800 18px var(--font-display); letter-spacing: -0.02em; }
.logo { display: grid; place-items: center; width: 30px; height: 30px; border-radius: 9px; background: var(--lemon); color: var(--on-hl); font: 800 17px var(--font-display); transform: rotate(-6deg); box-shadow: 3px 3px 0 var(--gum); }

h1.title { margin: 0; font: 900 27px/1.25 var(--font-display); letter-spacing: -0.01em; text-wrap: balance; }
h1.title:focus { outline: none; }
.sub-line { margin: 4px 0 0; color: var(--muted); font-size: 14px; }
.section-h { display: flex; align-items: baseline; justify-content: space-between; margin: 2px 2px -6px; }
.section-h h3 { margin: 0; font-size: 15px; font-weight: 700; }
.section-h button { border: 0; background: none; color: var(--grape-text); font-size: 13px; font-weight: 700; cursor: pointer; padding: 4px; }

/* Highlighter stroke — the signature mark */
.hl {
  --c: var(--lemon);
  --band: color-mix(in oklab, var(--c) var(--hl-strength), var(--paper));
  background-image: linear-gradient(100deg, transparent 0.4em, var(--band) 0.4em, var(--band) calc(100% - 0.3em), transparent calc(100% - 0.3em));
  background-repeat: no-repeat;
  background-size: 100% 0.5em;
  background-position: 0 88%;
  padding: 0 0.12em;
  margin: 0 -0.05em;
  -webkit-box-decoration-break: clone;
  box-decoration-break: clone;
}
.hl.sweep { animation: sweep 0.7s 0.15s cubic-bezier(.2,.7,.3,1) both; }
@keyframes sweep { from { background-size: 0% 0.5em; } to { background-size: 100% 0.5em; } }

/* Cards & lists */
.card { background: var(--card); border-radius: 20px; box-shadow: var(--shadow); padding: 16px; }
.stack-v { display: flex; flex-direction: column; gap: 10px; }
.list { background: var(--card); border-radius: 20px; box-shadow: var(--shadow); overflow: hidden; }
.list > * + * { border-top: 1px solid var(--line); }
.row { display: flex; align-items: center; gap: 12px; width: 100%; padding: 13px 14px; border: 0; background: none; text-align: left; }
button.row { cursor: pointer; }
button.row:hover { background: color-mix(in oklab, var(--card-2) 60%, transparent); }
.row .grow { flex: 1; min-width: 0; }
.row .t { display: block; font-weight: 700; font-size: 14.5px; line-height: 1.35; }
.row .m { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; margin-top: 3px; font-size: 12.5px; color: var(--muted); }

.chip { display: inline-flex; align-items: center; gap: 4px; padding: 2px 9px; border-radius: 999px; background: var(--card-2); color: var(--ink-2); font-size: 12px; font-weight: 600; white-space: nowrap; }
.chip.c { background: color-mix(in oklab, var(--c) 34%, var(--card)); color: var(--ink); }
.chip.good { background: var(--good-soft); color: var(--good); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.bad { background: var(--bad-soft); color: var(--bad); }
.chip.grape { background: var(--grape-soft); color: var(--grape-text); }
.pdot { width: 8px; height: 8px; border-radius: 50%; background: var(--c); flex: none; }

.av { --c: var(--lemon); display: inline-grid; place-items: center; flex: none; width: 34px; height: 34px; border-radius: 50%; background: var(--c); color: var(--on-hl); font-weight: 900; font-size: 14px; border: 2px solid var(--card); }
.av.sm { width: 26px; height: 26px; font-size: 11.5px; }
.av.lg { width: 64px; height: 64px; font-size: 26px; border-width: 3px; }
.stack { display: flex; }
.stack .av + .av { margin-left: -9px; }

.kind { display: grid; place-items: center; flex: none; width: 40px; height: 40px; border-radius: 13px; background: color-mix(in oklab, var(--c) 30%, var(--card)); font-size: 19px; }
.due { text-align: right; font-size: 12px; font-weight: 700; color: var(--muted); line-height: 1.3; font-variant-numeric: tabular-nums; flex: none; }
.due.urgent { color: var(--bad); }

.bar { display: block; height: 8px; border-radius: 999px; background: var(--card-2); overflow: hidden; }
.bar > i { display: block; height: 100%; border-radius: inherit; background: var(--c, var(--grape)); }

/* Buttons */
.btn { appearance: none; display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 0; border-radius: 15px; padding: 13px 18px; background: var(--grape); color: var(--on-grape); font-weight: 700; font-size: 15px; cursor: pointer; box-shadow: 0 4px 0 var(--grape-press); transition: transform 0.08s ease, box-shadow 0.08s ease; }
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--grape-press); }
.btn.block { width: 100%; }
.btn.sm { padding: 8px 13px; font-size: 13px; border-radius: 12px; box-shadow: 0 3px 0 var(--grape-press); }
.btn.soft { background: var(--card-2); color: var(--ink); box-shadow: 0 3px 0 var(--line); }
.btn.soft:active { box-shadow: 0 1px 0 var(--line); }
.btn.hlb { background: var(--c); color: var(--on-hl); box-shadow: 0 4px 0 color-mix(in oklab, var(--c) 62%, #000); }
.btn.hlb:active { box-shadow: 0 1px 0 color-mix(in oklab, var(--c) 62%, #000); }
.btn.danger { background: var(--bad-soft); color: var(--bad); box-shadow: 0 3px 0 color-mix(in oklab, var(--bad) 30%, var(--card)); }
.btn[disabled] { opacity: 0.45; cursor: not-allowed; transform: none; }
.link { border: 0; background: none; padding: 0; color: var(--grape-text); font-weight: 700; cursor: pointer; text-align: left; }

.seg { display: flex; gap: 4px; padding: 4px; border-radius: 14px; background: var(--card-2); }
.seg button { flex: 1; border: 0; background: none; padding: 8px 6px; border-radius: 10px; font-size: 13.5px; font-weight: 700; color: var(--muted); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--card); color: var(--ink); box-shadow: 0 1px 4px rgba(0,0,0,0.08); }

/* Prototype-only controls read as annotations, not UI */
.proto { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; padding: 8px 10px; border: 1.5px dashed color-mix(in oklab, var(--grape) 55%, transparent); border-radius: 14px; font-size: 12px; color: var(--grape-text); }
.proto b { font-weight: 700; margin-right: 2px; }
.proto button { border: 0; border-radius: 999px; padding: 4px 10px; font-size: 12px; font-weight: 700; background: var(--card); color: var(--ink-2); cursor: pointer; }
.proto button[aria-pressed="true"] { background: var(--grape); color: var(--on-grape); }

/* Home */
.hello { display: flex; flex-direction: column; gap: 2px; }
.invite { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; align-items: center; background: color-mix(in oklab, var(--lilac) 22%, var(--card)); }
.invite .emo { font-size: 30px; grid-row: span 2; }
.invite p { margin: 0; font-size: 14px; line-height: 1.45; }
.invite .actions { grid-column: 2; display: flex; gap: 8px; margin-top: 8px; }
.proj { display: flex; flex-direction: column; gap: 12px; width: 100%; text-align: left; border: 0; }
button.proj { cursor: pointer; }
.proj .head { display: flex; align-items: flex-start; gap: 12px; }
.proj .code { flex: none; padding: 5px 9px; border-radius: 10px; background: var(--c); color: var(--on-hl); font: 800 13px var(--font-display); transform: rotate(-3deg); }
.proj .name { display: block; font-weight: 900; font-size: 16.5px; line-height: 1.3; }
.proj .meta { display: block; font-size: 12.5px; color: var(--muted); margin-top: 2px; }
.proj .foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 12.5px; color: var(--muted); flex-wrap: wrap; }
.pct { font: 700 13px var(--font-display); color: var(--ink); font-variant-numeric: tabular-nums; }
.fab { position: absolute; right: 18px; bottom: 96px; z-index: 8; width: 58px; height: 58px; border-radius: 20px; display: grid; place-items: center; padding: 0; }
.fab-space { flex: none; height: 56px; }
@media (max-width: 899px) { .fab { bottom: calc(92px + env(safe-area-inset-bottom, 0px)); } }

/* Sheet */
.sheet-wrap { position: absolute; inset: 0; z-index: 30; display: flex; align-items: flex-end; background: rgba(20, 16, 36, 0.45); }
.sheet { width: 100%; max-height: 88%; overflow-y: auto; background: var(--card); border-radius: 26px 26px 0 0; padding: 10px 18px calc(28px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 10px; animation: rise 0.22s ease-out; }
.sheet .grab { width: 40px; height: 5px; border-radius: 3px; background: var(--line); margin: 0 auto 6px; }
.sheet h4 { margin: 0 0 4px; font-size: 16px; }
.sheet p { margin: 0; font-size: 13.5px; color: var(--ink-2); }
.sheet-opt { display: flex; align-items: center; gap: 12px; width: 100%; padding: 12px; border: 0; border-radius: 16px; background: var(--card-2); text-align: left; cursor: pointer; }
.sheet-opt b { display: block; font-size: 15px; }
.sheet-opt span span { font-size: 12.5px; color: var(--muted); }
@keyframes rise { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }

.toast { position: absolute; left: 16px; right: 16px; top: 52px; z-index: 40; padding: 12px 16px; border-radius: 16px; background: var(--ink); color: var(--paper); font-weight: 600; font-size: 14px; text-align: center; box-shadow: var(--shadow); pointer-events: none; opacity: 0; transform: translateY(-8px); transition: opacity 0.2s, transform 0.2s; }
.toast.show { opacity: 1; transform: none; }
@media (max-width: 899px) { .toast { top: calc(12px + env(safe-area-inset-top, 0px)); } }
#confetti { position: absolute; inset: 0; z-index: 35; pointer-events: none; width: 100%; height: 100%; }

/* Project page */
.p-hero { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; }
.p-hero .name { font: 900 21px/1.25 var(--font-display); }
.p-hero .meta { font-size: 12.5px; color: var(--muted); margin-top: 4px; }
.ring { position: relative; width: 86px; height: 86px; }
.ring svg { display: block; transform: rotate(-90deg); }
.ring b { position: absolute; inset: 0; display: grid; place-items: center; align-content: center; font: 800 22px/1 var(--font-display); font-variant-numeric: tabular-nums; }
.ring b small { font: 600 10.5px var(--font-body); color: var(--muted); margin-top: 3px; }
.p-stats { display: flex; gap: 8px; flex-wrap: wrap; grid-column: 1 / -1; }
.pkg-row { display: flex; flex-direction: column; padding: 0; overflow: hidden; }
.pkg-top { display: flex; align-items: center; gap: 12px; width: 100%; border: 0; background: none; padding: 14px 16px; text-align: left; cursor: pointer; }
.pkg-num { display: grid; place-items: center; flex: none; width: 42px; height: 42px; border-radius: 14px; background: var(--c); color: var(--on-hl); font: 800 19px var(--font-display); }
.pkg-tasks { display: flex; flex-direction: column; gap: 6px; padding: 0 16px 14px 70px; }
.mini-task { display: flex; align-items: center; gap: 8px; width: 100%; border: 0; background: var(--card-2); border-radius: 12px; padding: 9px 10px; text-align: left; font-size: 13.5px; cursor: pointer; }
.mini-task .st { font-size: 14px; }
.mini-task .w { margin-left: auto; font: 600 12px var(--font-body); color: var(--muted); white-space: nowrap; }
.chev { transition: transform 0.2s; color: var(--muted); display: grid; }
.chev.open { transform: rotate(90deg); }

.podium { display: grid; grid-template-columns: 1fr 1.15fr 1fr; align-items: end; gap: 8px; padding-top: 8px; }
.pod { display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; }
.pod .medal { font-size: 22px; line-height: 1; }
.pod .nm { font-size: 13px; font-weight: 700; }
.pod .block { width: 100%; border-radius: 16px 16px 6px 6px; background: color-mix(in oklab, var(--c) 34%, var(--card)); display: grid; place-items: center; align-content: center; font: 800 22px/1 var(--font-display); font-variant-numeric: tabular-nums; }
.pod .block small { font: 600 11px var(--font-body); color: var(--ink-2); }
.formula { font-size: 12.5px; color: var(--ink-2); background: var(--card-2); border-radius: 14px; padding: 12px 14px; line-height: 1.6; }
.formula b { color: var(--ink); }
.rank-row { display: grid; grid-template-columns: 22px auto 1fr auto; align-items: center; gap: 10px; padding: 12px 14px; }
.rank-row .no { font: 700 13px var(--font-display); color: var(--muted); text-align: center; }
.rank-row .earned { font: 800 18px var(--font-display); font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
.rank-row .of { display: block; font: 500 11px var(--font-body); color: var(--muted); }
.rank-row .badges-inline { font-size: 13px; letter-spacing: 1px; }

.feed-item { display: grid; grid-template-columns: auto 1fr; gap: 10px; padding: 12px 14px; font-size: 13.5px; }
.feed-item .when { display: block; font-size: 11.5px; color: var(--muted); margin-top: 2px; }

/* Pick carousel */
.carousel { display: flex; gap: 14px; overflow-x: auto; scroll-snap-type: x mandatory; margin: 0 -18px; padding: 6px 18px 18px; scrollbar-width: none; }
.carousel::-webkit-scrollbar { display: none; }
.pcard { flex: none; width: 84%; scroll-snap-align: center; background: var(--card); border-radius: 26px; box-shadow: var(--shadow); overflow: hidden; display: flex; flex-direction: column; }
.pcard .band { background: var(--c); color: var(--on-hl); padding: 16px 18px 14px; display: grid; grid-template-columns: 1fr auto; align-items: end; gap: 4px 10px; position: relative; }
.pcard .band .lbl { font-weight: 900; font-size: 14px; }
.pcard .band .big { font: 800 44px/0.95 var(--font-display); letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
.pcard .band .big small { font-size: 17px; letter-spacing: 0; margin-left: 2px; }
.pcard .band .hrs { font-size: 12.5px; font-weight: 700; text-align: right; opacity: 0.85; }
.pcard .band::after { content: ""; position: absolute; left: 0; right: 0; bottom: -7px; height: 14px; background: radial-gradient(circle at 7px 0, var(--c) 6px, transparent 6.5px) 0 0 / 14px 14px repeat-x; }
.pcard .body { padding: 20px 16px 16px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
.ptask { display: grid; grid-template-columns: auto 1fr auto; gap: 8px; align-items: center; width: 100%; border: 0; background: none; padding: 2px 0; text-align: left; font-size: 13.5px; cursor: pointer; }
.ptask .tg { font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 7px; background: var(--card-2); color: var(--ink-2); }
.ptask .d { font: 500 11.5px var(--font-body); color: var(--muted); text-align: right; line-height: 1.3; }
.pcard .foot { padding: 0 16px 18px; display: flex; flex-direction: column; gap: 8px; }
.owner-line { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
.dots { display: flex; justify-content: center; gap: 6px; margin-top: -8px; }
.dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--line); transition: width 0.2s, background 0.2s; }
.dots i.on { width: 20px; border-radius: 4px; background: var(--ink); }
.leader-tools { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.leader-tools .lt-h { flex-basis: 100%; font-weight: 700; font-size: 14px; }

/* Task detail */
.t-head { display: flex; flex-direction: column; gap: 8px; }
.t-meta { display: flex; flex-wrap: wrap; gap: 6px; }
.t-desc { margin: 0; font-size: 14px; color: var(--ink-2); }
.owner-bar { display: flex; align-items: center; gap: 10px; font-size: 13.5px; }
.ev-opts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.ev-opt { display: flex; flex-direction: column; gap: 6px; align-items: flex-start; border: 2px dashed var(--line); border-radius: 18px; background: var(--card); padding: 14px; text-align: left; cursor: pointer; }
.ev-opt:hover { border-color: var(--grape); }
.ev-opt b { font-size: 14px; }
.ev-opt span { font-size: 11.5px; color: var(--muted); line-height: 1.4; }
.file-chip { display: flex; align-items: center; gap: 10px; padding: 12px; border-radius: 16px; background: var(--card-2); }
.file-chip .ico { display: grid; place-items: center; width: 38px; height: 38px; border-radius: 11px; background: var(--card); flex: none; }
.file-chip b { display: block; font-size: 13.5px; word-break: break-all; }
.file-chip span { font-size: 12px; color: var(--muted); }
.commit { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; width: 100%; padding: 11px 14px; border: 0; background: none; text-align: left; font-size: 13px; cursor: pointer; }
.commit:hover { background: color-mix(in oklab, var(--card-2) 60%, transparent); }
.commit code { font: 500 12px var(--font-mono); color: var(--grape-text); }
.commit .lines { font: 500 11.5px var(--font-mono); color: var(--muted); }
.scan { position: relative; overflow: hidden; padding: 18px 16px; display: flex; flex-direction: column; gap: 10px; }
.scan .ln { height: 9px; border-radius: 5px; background: var(--card-2); }
.scan .ln:nth-child(2) { width: 88%; }
.scan .ln:nth-child(3) { width: 94%; }
.scan .ln:nth-child(4) { width: 70%; }
.scan .sweeper { position: absolute; top: 0; bottom: 0; left: -40%; width: 40%; background: linear-gradient(90deg, transparent, color-mix(in oklab, var(--lemon) 55%, transparent), transparent); animation: scan 1.1s linear infinite; }
@keyframes scan { to { left: 100%; } }
.result { display: flex; flex-direction: column; gap: 10px; border-radius: 22px; padding: 18px; }
.result.good { background: var(--good-soft); }
.result.warn { background: var(--warn-soft); }
.result.bad { background: var(--bad-soft); }
.result .grade { font: 900 34px/1 var(--font-display); letter-spacing: 0.02em; }
.result.good .grade { color: var(--good); }
.result.warn .grade { color: var(--warn); }
.result.bad .grade { color: var(--bad); }
.result .gain { font-size: 13.5px; color: var(--ink); font-weight: 700; }
.result .by { font-size: 12.5px; color: var(--ink-2); }
.result ul { margin: 0; padding-left: 20px; font-size: 13.5px; color: var(--ink); display: flex; flex-direction: column; gap: 4px; }
.override { border: 2px solid color-mix(in oklab, var(--grape) 40%, transparent); background: var(--card); border-radius: 18px; padding: 14px; display: flex; flex-direction: column; gap: 8px; font-size: 13px; }
.done-panel { text-align: center; padding: 22px 16px; border-radius: 22px; background: var(--good-soft); display: flex; flex-direction: column; gap: 6px; align-items: center; }
.done-panel .big-emoji { font-size: 42px; line-height: 1; }
.done-panel b { font-size: 17px; color: var(--good); }

/* Badges */
.badges { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.badge { display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; background: var(--card); border-radius: 18px; box-shadow: var(--shadow); padding: 14px 8px 12px; }
.badge .coin { display: grid; place-items: center; width: 56px; height: 56px; border-radius: 50%; background: color-mix(in oklab, var(--c) 40%, var(--card)); border: 3px solid var(--c); font-size: 26px; }
.badge b { font-size: 12.5px; line-height: 1.3; }
.badge span { font-size: 10.5px; color: var(--muted); line-height: 1.35; }
.badge .src { font: 600 10px var(--font-body); color: var(--grape-text); }
.badge.locked .coin { filter: grayscale(1); opacity: 0.4; border-style: dashed; }
.badge.locked b { color: var(--muted); }

/* Notifications */
.notif { display: grid; grid-template-columns: auto 1fr; gap: 12px; padding: 14px; position: relative; }
.notif.unread::before { content: ""; position: absolute; top: 20px; right: 14px; width: 8px; height: 8px; border-radius: 50%; background: var(--grape); }
.notif .emo { display: grid; place-items: center; width: 40px; height: 40px; border-radius: 13px; background: color-mix(in oklab, var(--c) 32%, var(--card)); font-size: 20px; flex: none; }
.notif p { margin: 0; font-size: 14px; line-height: 1.5; padding-right: 14px; }
.notif .when { display: block; font-size: 11.5px; color: var(--muted); margin-top: 4px; }
.notif .acts { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.weekly { background: var(--ink); color: var(--paper); border-radius: 22px; padding: 18px; display: flex; flex-direction: column; gap: 12px; }
.weekly h4 { margin: 0; font: 800 17px var(--font-display); }
.weekly .wk-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.weekly .wk { background: color-mix(in oklab, var(--paper) 10%, transparent); border-radius: 14px; padding: 10px 12px; }
.weekly .wk small { display: block; font-size: 11.5px; opacity: 0.8; }
.weekly .wk b { font: 800 22px var(--font-display); font-variant-numeric: tabular-nums; }
.weekly .wk.up b { color: var(--on-ink-good); }
.weekly .line { font-size: 13.5px; display: flex; align-items: center; gap: 8px; }

/* Me */
.me-head { display: flex; align-items: center; gap: 14px; }
.me-head b { display: block; font: 900 20px var(--font-display); }
.me-head span { font-size: 13px; color: var(--muted); }
.set-row { display: flex; align-items: center; gap: 12px; padding: 13px 14px; font-size: 14px; }
.set-row.col { flex-direction: column; align-items: stretch; gap: 8px; }
.set-row .grow { flex: 1; min-width: 0; }
.set-row small { display: block; font-size: 12px; color: var(--muted); }
.toggle { width: 44px; height: 26px; border-radius: 999px; background: var(--good); position: relative; flex: none; border: 0; cursor: pointer; }
.toggle::after { content: ""; position: absolute; top: 3px; right: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; transition: right 0.15s; }
.toggle[aria-pressed="false"] { background: var(--line); }
.toggle[aria-pressed="false"]::after { right: 21px; }

/* New project flow */
.flow-top { display: grid; grid-template-columns: 40px 1fr 40px; align-items: center; gap: 8px; padding-top: 4px; }
.steps { display: flex; gap: 5px; }
.steps i { flex: 1; height: 6px; border-radius: 3px; background: var(--card-2); }
.steps i.on { background: var(--grape); }
.step-label { text-align: center; font-size: 12px; color: var(--muted); font-weight: 700; margin-top: 6px; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label, .field .lbl { font-size: 13px; font-weight: 700; color: var(--ink-2); }
.field small { font-weight: 500; color: var(--muted); }
.input { width: 100%; border: 2px solid var(--line); border-radius: 14px; background: var(--card); padding: 12px 14px; font: inherit; color: var(--ink); }
.input:focus { border-color: var(--grape); outline: none; }
textarea.input { min-height: 132px; resize: vertical; line-height: 1.6; }
.stepper { display: inline-flex; align-items: center; border: 2px solid var(--line); border-radius: 14px; background: var(--card); overflow: hidden; align-self: flex-start; }
.stepper button { width: 46px; height: 44px; border: 0; background: none; font-size: 20px; font-weight: 700; cursor: pointer; color: var(--ink); }
.stepper output { min-width: 34px; text-align: center; font: 800 19px var(--font-display); }
.two { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: end; }
.hint { font-size: 12.5px; color: var(--muted); }
.drop { border: 2px dashed var(--line); border-radius: 20px; padding: 18px; display: flex; flex-direction: column; gap: 12px; background: var(--card); }
.ai-card { display: flex; flex-direction: column; gap: 10px; }
.check { display: flex; align-items: center; gap: 10px; font-size: 13.5px; border: 0; background: none; padding: 0; text-align: left; cursor: pointer; }
.check .box { width: 22px; height: 22px; border-radius: 7px; border: 2px solid var(--line); display: grid; place-items: center; flex: none; color: var(--on-grape); }
.check[aria-pressed="true"] .box { background: var(--grape); border-color: var(--grape); }
.manual-row { display: grid; grid-template-columns: 1fr 76px 36px; gap: 8px; align-items: center; }
.sticky-foot { margin-top: auto; padding-top: 6px; display: flex; flex-direction: column; gap: 8px; }
.warn-box { font-size: 12.5px; color: var(--warn); background: var(--warn-soft); border-radius: 14px; padding: 10px 12px; }

.doc-scan { background: var(--card); border-radius: 22px; box-shadow: var(--shadow); padding: 20px 18px; display: flex; flex-direction: column; gap: 11px; }
.doc-scan .ln { height: 11px; border-radius: 6px; background: var(--card-2); position: relative; overflow: hidden; }
.doc-scan .ln i { position: absolute; inset: 0; background: color-mix(in oklab, var(--c) var(--hl-strength), var(--card-2)); transform-origin: left; transform: scaleX(0); animation: mark 0.6s ease-out forwards; }
@keyframes mark { to { transform: scaleX(1); } }
.checks { display: flex; flex-direction: column; gap: 10px; font-size: 14px; }
.checks div { display: flex; align-items: center; gap: 10px; }
.checks .ok { color: var(--good); font-weight: 900; }
.checks .spin { width: 16px; height: 16px; border-radius: 50%; border: 2.5px solid var(--line); border-top-color: var(--grape); animation: spin 0.8s linear infinite; flex: none; }
.checks .wait { color: var(--muted); }
@keyframes spin { to { transform: rotate(360deg); } }

.choice { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; width: 100%; text-align: left; border: 2px solid var(--line); background: var(--card); border-radius: 18px; padding: 14px; cursor: pointer; }
.choice[aria-pressed="true"] { border-color: var(--grape); background: color-mix(in oklab, var(--grape-soft) 60%, var(--card)); }
.choice .box { grid-row: span 3; width: 24px; height: 24px; border-radius: 8px; border: 2px solid var(--line); display: grid; place-items: center; margin-top: 2px; color: var(--on-grape); }
.choice.radio .box { border-radius: 50%; }
.choice[aria-pressed="true"] .box { background: var(--grape); border-color: var(--grape); }
.choice .nm { font-weight: 900; font-size: 15px; }
.choice .why { font-size: 12.5px; color: var(--ink-2); }
.choice .tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }

.plan-ms { display: flex; flex-direction: column; gap: 8px; }
.ms { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; font-size: 13.5px; }
.ms .tag { font: 700 12px var(--font-display); padding: 3px 8px; border-radius: 8px; background: var(--ink); color: var(--paper); }
.ms .dt { font: 500 12px var(--font-mono); color: var(--muted); }
.plan-ws { display: flex; flex-direction: column; gap: 10px; }
.ws-h { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-weight: 900; font-size: 14.5px; }
.ws-h .w { font: 800 15px var(--font-display); color: var(--grape-text); white-space: nowrap; }
.pl-task { display: grid; grid-template-columns: 1fr auto auto 30px; gap: 8px; align-items: center; font-size: 13.5px; padding: 6px 0; }
.pl-task + .pl-task { border-top: 1px dashed var(--line); }
.pl-task .w { font: 600 12px var(--font-body); color: var(--ink-2); white-space: nowrap; }
.pl-task .dt { font: 500 11.5px var(--font-mono); color: var(--muted); padding: 3px 7px; border-radius: 8px; background: var(--card-2); }
.del { width: 30px; height: 30px; border: 0; border-radius: 9px; background: none; color: var(--muted); display: grid; place-items: center; cursor: pointer; }
.del:hover { background: var(--card-2); color: var(--bad); }
.split { display: flex; height: 18px; border-radius: 9px; overflow: hidden; gap: 3px; }
.split i { background: var(--c); }
.code-box { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 14px 16px; border-radius: 18px; background: var(--card-2); }
.code-box b { font: 500 22px var(--font-mono); letter-spacing: 0.12em; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; }
}
</style>
</head>
<body>
<div class="stage">
  <aside class="map" id="map" aria-label="原型页面导航"></aside>
  <div class="device">
    <div class="phone" id="phone">
      <div class="statusbar" aria-hidden="true">
        <span>9:41</span>
        <span class="icons">
          <svg width="18" height="12" viewBox="0 0 18 12"><rect x="0" y="8" width="3" height="4" rx="1" fill="currentColor"/><rect x="5" y="5.5" width="3" height="6.5" rx="1" fill="currentColor"/><rect x="10" y="3" width="3" height="9" rx="1" fill="currentColor"/><rect x="15" y="0" width="3" height="12" rx="1" fill="currentColor"/></svg>
          <svg width="26" height="12" viewBox="0 0 26 12"><rect x="0.5" y="0.5" width="22" height="11" rx="3.5" fill="none" stroke="currentColor" opacity=".4"/><rect x="2" y="2" width="16" height="8" rx="2" fill="currentColor"/><rect x="24" y="4" width="1.6" height="4" rx=".8" fill="currentColor" opacity=".5"/></svg>
        </span>
      </div>
      <main class="screen" id="screen"></main>
      <nav class="tabbar" id="tabbar" aria-label="主导航"></nav>
      <canvas id="confetti" aria-hidden="true"></canvas>
      <div class="toast" id="toast" role="status" aria-live="polite"></div>
      <div class="sheet-wrap" id="sheet" hidden></div>
      <div class="home-bar"></div>
    </div>
  </div>
  <button class="map-fab" id="mapFab" type="button" aria-controls="map" aria-expanded="false">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 3 9 5-9 5-9-5z"/><path d="m3 13 9 5 9-5"/></svg>
    页面
  </button>
</div>

<script>
(() => {
  // ── Icons ───────────────────────────────────────────────────────────
  const svg = (d, s = 22, w = 2) =>
    `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
  const I = {
    home: (s) => svg('<path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>', s),
    tasks: (s) => svg('<rect x="3" y="3" width="18" height="18" rx="5"/><path d="m8 12 3 3 5-6"/>', s),
    bell: (s) => svg('<path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/>', s),
    user: (s) => svg('<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>', s),
    plus: (s) => svg('<path d="M12 5v14M5 12h14"/>', s, 2.6),
    back: (s) => svg('<path d="m15 18-6-6 6-6"/>', s, 2.4),
    close: (s) => svg('<path d="M18 6 6 18M6 6l12 12"/>', s, 2.4),
    gear: (s) => svg('<path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/>', s),
    upload: (s) => svg('<path d="M12 15V4M7 9l5-5 5 5"/><path d="M4 15v4a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-4"/>', s),
    file: (s) => svg('<path d="M14 3H6a1 1 0 0 0-1 1v16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8z"/><path d="M14 3v5h5"/>', s),
    copy: (s) => svg('<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M4 16V5a1 1 0 0 1 1-1h11"/>', s),
    chevron: (s) => svg('<path d="m9 18 6-6-6-6"/>', s),
    sparkle: (s) => svg('<path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/>', s),
    shuffle: (s) => svg('<path d="M16 3h5v5"/><path d="M4 20 21 3"/><path d="M21 16v5h-5"/><path d="m15 15 6 6"/><path d="M4 4l5 5"/>', s),
    github: (s = 18) =>

    const manual = S.newTab === 'manual';
    const agile = !manual && !S.noKey && S.choiceType === 'method';
    const nameOf = { A: '星巴克', B: 'Grab', C: '特斯拉', D: '喜茶', E: 'Shopee' };
    const picked = Object.entries(S.choices).filter(([, v]) => v).map(([k]) => nameOf[k]);
    const titleOf = (w) => w.t || `案例分析：${(w.key === 'c1' ? picked[0] : picked[1]) || '案例'}`;
    let body;
    let total;
    if (manual) {
      total = S.manual.reduce((s, m) => s + m.p, 0);
      body = `<div class="card">${S.manual.map((m, i) => `<div class="pl-task"><span>${m.t}</span><span class="w">${m.p} 分</span><span></span><button class="del" data-act="mdel:${i}" aria-label="删除 ${m.t}">${I.close(14)}</button></div>`).join('')}
        <button class="link" data-act="madd" style="margin-top:8px">+ 加任务</button></div>`;
    } else {
      total = S.plan.reduce((s, w) => s + w.tasks.reduce((a, x) => a + x[1], 0), 0);
      const ms = agile
        ? [['S1', 'Sprint 1 交付', '10/9'], ['S2', 'Sprint 2 交付', '10/23'], ['S3', '最终交付与演示', '11/6']]
        : [['M1', '选题与调研', '9/28'], ['M2', '分析与初稿', '10/8'], ['M3', '定稿与演示', '10/15']];
      body = `<div class="card plan-ms">${ms.map(([k, n, d]) => `<div class="ms"><span class="tag">${k}</span><span>${n}</span><span class="dt">${d}</span></div>`).join('')}</div>
        <div class="plan-ws">${S.plan.map((w, wi) => `
          <div class="card">
            <div class="ws-h"><span>${titleOf(w)}</span><span class="w">${w.tasks.reduce((a, x) => a + x[1], 0)} 分</span></div>
            ${w.tasks.map(([n, p, d], ti) => `<div class="pl-task"><span>${n}</span><span class="w">${p} 分</span><span class="dt">${d}</span><button class="del" data-act="pdel:${wi}.${ti}" aria-label="删除 ${n}">${I.close(14)}</button></div>`).join('')}
            <button class="link" data-act="padd:${wi}" style="margin-top:6px">+ 加任务</button>
          </div>`).join('')}
        </div>`;
    }
    const ok = total === 100;
    return `${flowTop(5)}
      <div>
        <h1 class="title" tabindex="-1">看看这样<span class="hl" style="--c:var(--lilac)">分对不对</span></h1>
        <p class="sub-line">${manual ? '这是你自己列的任务。' : agile ? '按 Agile（Scrum）拆的任务：每个 Sprint 有开发任务和回顾会。' : '名称、贡献值、截止日期都能直接改，也可以加任务、删任务。'}</p>
      </div>
      ${S.noKey && !manual ? '<div class="warn-box">这是规则解析的结果，比较粗糙，请仔细检查。</div>' : ''}
      ${agile ? '<div class="proto"><b>原型</b>这个例子只演示到这一步，后面接回 MKT201 的例子。</div>' : ''}
      ${body}
      <div class="sticky-foot">
        <span class="chip ${ok ? 'good' : 'warn'}" style="align-self:center">${ok ? '合计 100 分 ✓' : `合计 ${total} 分，确认时会按比例换算成 100 分`}</span>
        <button class="btn block" data-go="new6">分成 ${S.team} 个任务包</button>
      </div>`;
  }

  function screenNew6() {
    const n = S.team;
    const each = 100 / n;
    const colors = ['gum', 'sky', 'lilac', 'mint', 'tang', 'lemon', 'gum', 'sky'];
    return `${flowTop(6)}
      <div>
        <h1 class="title" tabindex="-1">分好了！<span class="hl" style="--c:var(--mint)">${n} 个任务包</span></h1>
        <p class="sub-line">${Number.isInteger(each) ? `每包都是 ${each} 分。` : `每包大约 ${each.toFixed(1)} 分。任务不能切得更细，所以会有一点点差距。`}没人选的包先用待选色，被选走后会变成主人的颜色。</p>
      </div>
      <div class="split" aria-hidden="true">${Array.from({ length: n }, (_, i) => `<i style="flex:1;--c:var(--${colors[i]})"></i>`).join('')}</div>
      <div class="card stack-v">
        <b>把组员拉进来</b>
        <div class="code-box"><b>MKT-7Q4P</b><button class="btn sm soft" data-act="toast:邀请链接已复制">${I.copy(16)} 复制链接</button></div>
        <div class="field"><label for="inv">或者输入邮箱、GitHub 用户名</label><input id="inv" class="input" placeholder="xiaowen@uni.edu, @ahmad-dev"></div>
        <span class="hint">对方登录后，会在首页看到邀请。</span>
      </div>
      <div class="sticky-foot"><button class="btn block" data-act="topick">去选我的任务包</button></div>`;
  }

  // ── Sheets ──────────────────────────────────────────────────────────
  const SHEETS = {
    fab: () => `<h4>要做什么？</h4>
      <button class="sheet-opt" data-go="new1"><span style="font-size:24px" aria-hidden="true">✨</span><span><b>新建项目</b><span>你当组长，上传作业要求让 AI 拆任务</span></span></button>
      <button class="sheet-opt" data-act="toast:输入组员给你的邀请码，例如 MKT-7Q4P"><span style="font-size:24px" aria-hidden="true">🔑</span><span><b>用邀请码加入</b><span>组员分享给你的邀请码或链接</span></span></button>`,
    commit: () => `<h4>这个提交属于哪个任务？</h4>
      <p>AI 自动归类的，归错了就改一下。</p>
      ${myOpenTasks().filter((id) => T[id].proj === 'CS302').map((id) => `<button class="sheet-opt" data-act="toast:已把这个提交改归到「${T[id].t}」"><span style="font-size:22px" aria-hidden="true">${KIND[T[id].k].e}</span><span><b>${T[id].t}</b><span>${T[id].pts} 分 · ${T[id].due}</span></span></button>`).join('')}
      <button class="sheet-opt" data-act="toast:这个提交不会算进任何任务"><span style="font-size:22px" aria-hidden="true">🚫</span><span><b>不属于任何任务</b><span>例如改错字、改格式</span></span></button>`,
    addtask: () => `<h4>加一个任务</h4>
      <div class="field"><label for="nt">任务名称</label><input id="nt" class="input" value="补充访谈：学生消费者"></div>
      <div class="field"><label for="ntp">贡献值</label><input id="ntp" class="input" value="4 分"></div>
      <p>加进去后，会<b>自动放进目前最轻的任务包</b>。所有任务的贡献值会按比例换算，总分还是 100 分。</p>
      <button class="btn block" data-act="toast:已加入目前最轻的任务包">加进去</button>`,
    resplit: () => `<h4>重新分包</h4>
      <p>还没开始的任务会重新平均分配；已经开始或完成的任务，留在原来的人那里。有人加入或退出时可以用。</p>
      <div class="field"><span class="lbl" id="lbl-rs">分成几个包</span><div class="stepper" role="group" aria-labelledby="lbl-rs"><button type="button" aria-label="减少任务包" data-act="toast:至少要和现在的成员人数一样多">−</button><output>5</output><button type="button" aria-label="增加任务包" data-act="toast:样稿里固定 5 个包">+</button></div></div>
      <button class="btn block" data-act="toast:已重新分包，大家会收到通知">重新分包</button>`,
  };
  let sheetReturn = null;
  function openSheet(name) {
    const el = $('#sheet');
    el.innerHTML = `<div class="sheet" role="dialog" aria-modal="true" aria-label="选项"><div class="grab" aria-hidden="true"></div>${SHEETS[name]()}</div>`;
    el.hidden = false;
    el.querySelector('button, input')?.focus();
  }
  function closeSheet(restoreFocus = true) {
    const el = $('#sheet');
    if (el.hidden) return;
    el.hidden = true;
    if (restoreFocus) sheetReturn?.focus?.();
    sheetReturn = null;
  }

  // ── Map (prototype navigation) ──────────────────────────────────────
  const MAP = [
    ['首页', [['home', '首页', '我的待办 + 项目'], ['tasks', '我的任务', '按截止日期排']]],
    ['新建项目 → AI 拆任务', [['new1', '基本信息'], ['new2', '告诉 AI 要做什么', '上传 / 打字 / 手动 + AI key'], ['new3', 'AI 拆解中'], ['new4', '选择题', '任选几题 / 选一个做法'], ['new5', '确认计划'], ['new6', '分包完成']]],
    ['任务包与交证据', [['pick', '选任务包', '左右滑动，点「选我！」'], ['project', '项目页', '任务包 / 排行 / 动态'], ['task', '任务详情', '交证据、AI 审核'], ['settings', '项目设置', '组长：AI key、群、结束项目']]],
    ['排行、徽章、通知', [['rank', '排行榜', '贡献值 × 质量档位'], ['badges', '徽章', '永久保存'], ['notifs', '通知', '调侃式提醒、换包、结束项目'], ['me', '我', '账号、外观、提醒']]],
  ];
  function renderMap() {
    const r = route();
    const cur = r === 'project' && S.projTab === 'rank' ? 'rank' : r;
    $('#map').innerHTML = `
      <button class="map-close" id="mapClose" type="button">关闭</button>
      <div class="map-head"><h2>MeritAI<br>手机样稿</h2><p>数据都是例子。点这里跳到任意页面，也可以直接在手机里点。</p></div>
      ${MAP.map(([g, items]) => `<div class="map-group"><h3>${g}</h3>${items.map(([key, name, hint], i) => `
        <button class="map-link ${key === cur ? 'on' : ''}" data-go="${key}" ${key === cur ? 'aria-current="page"' : ''}>${g.startsWith('新建') ? `<span class="n">${i + 1}</span>` : ''}<span><b>${name}</b>${hint ? `<br><span class="hint-t">${hint}</span>` : ''}</span></button>`).join('')}</div>`).join('')}
      <p class="map-note">虚线框是样稿专用的演示开关，正式 App 里不会出现。</p>`;
  }

  // ── Render ──────────────────────────────────────────────────────────
  const SCREENS = {
    home: screenHome, tasks: screenTasks, notifs: screenNotifs, me: screenMe,
    project: screenProject, settings: screenSettings, pick: screenPick, task: screenTask, badges: screenBadges,
    new1: screenNew1, new2: screenNew2, new3: screenNew3, new4: screenNew4, new5: screenNew5, new6: screenNew6,
  };
  let flowTimer = null;

  function focusKey(el) {
    if (!el || el === document.body) return null;
    for (const a of ['data-act', 'data-go']) if (el.hasAttribute(a)) return `[${a}="${CSS.escape(el.getAttribute(a))}"]`;
    if (el.id) return `#${CSS.escape(el.id)}`;
    return null;
  }

  function render(routeChanged) {
    const active = document.activeElement;
    const key = routeChanged ? null : focusKey(active);
    const inMap = !!active?.closest?.('#map');
    const r = route();
    screen.innerHTML = SCREENS[r]();
    if (routeChanged) screen.scrollTop = 0;
    const tabbar = $('#tabbar');
    tabbar.hidden = r.startsWith('new');
    const activeTab = TOP.includes(S.stack[0]) ? S.stack[0] : 'home';
    const unread = (myMktPkg() < 0 || S.swapReq?.status === 'pending' ? 1 : 0) + 1 + (OPEN.includes(T.cs_login.status) ? 1 : 0) + (S.eng === 'awaiting' ? 1 : 0);
    tabbar.innerHTML = [['home', '首页', I.home], ['tasks', '任务', I.tasks], ['notifs', '通知', I.bell], ['me', '我', I.user]]
      .map(([k, l, ic]) => `<button class="tab ${activeTab === k ? 'on' : ''}" data-go="${k}" ${activeTab === k ? 'aria-current="page"' : ''}><span class="ic">${ic(22)}</span>${l}${k === 'notifs' && unread ? `<span class="dot" aria-label="${unread} 条未读">${unread}</span>` : ''}</button>`)
      .join('');
    renderMap();

    if (key) {
      (document.querySelector(`${inMap ? '#map' : '#phone'} ${key}`) || document.querySelector(key))?.focus({ preventScroll: true });
    } else if (routeChanged && !inMap) {
      screen.querySelector('h1[tabindex], .appbar h2')?.focus({ preventScroll: true });
    }

    clearTimeout(flowTimer);
    if (r === 'new3') flowTimer = setTimeout(() => route() === 'new3' && go(S.noKey ? 'new5' : 'new4'), reduceMotion ? 800 : 3600);

    const car = $('#carousel');
    if (car) {
      const dots = [...document.querySelectorAll('#dots i')];
      const step = () => car.firstElementChild.offsetWidth + 14;
      const sync = () => {
        carouselPos = car.scrollLeft;
        const i = Math.round(car.scrollLeft / step());
        dots.forEach((d, j) => d.classList.toggle('on', j === i));
      };
      // Scroll after layout settles, otherwise scroll-snap puts the first card back.
      const mine = myMktPkg();
      const target = Math.max(0, mine >= 0 ? mine : S.mkt.findIndex((o) => !o));
      const left = routeChanged ? target * step() : carouselPos ?? 0;
      requestAnimationFrame(() => {
        car.scrollTo({ left, behavior: 'instant' });
        sync();
      });
      car.addEventListener('scroll', sync, { passive: true });
    }
  }
  let carouselPos = null;

  // ── Feedback: toast, confetti ───────────────────────────────────────
  let toastTimer = null;
  function toast(msg) {
    const el = $('#toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), 2800);
  }

  const canvas = $('#confetti');
  function confetti() {
    if (reduceMotion) return;
    const phone = $('#phone');
    const w = (canvas.width = phone.clientWidth);
    const h = (canvas.height = phone.clientHeight);
    const ctx = canvas.getContext('2d');
    const css = getComputedStyle(document.documentElement);
    const cols = ['--lemon', '--gum', '--mint', '--sky', '--tang', '--lilac'].map((v) => css.getPropertyValue(v).trim());
    const parts = Array.from({ length: 110 }, (_, i) => ({
      x: w / 2 + (Math.random() - 0.5) * 60,
      y: h * 0.42,
      vx: (Math.random() - 0.5) * 11,
      vy: -Math.random() * 12 - 5,
      r: Math.random() * Math.PI,
      vr: (Math.random() - 0.5) * 0.3,
      s: 6 + Math.random() * 6,
      c: cols[i % cols.length],
    }));
    const start = performance.now();
    (function frame(t) {
      ctx.clearRect(0, 0, w, h);
      parts.forEach((p) => {
        p.vy += 0.35;
        p.vx *= 0.99;
        p.x += p.vx;
        p.y += p.vy;
        p.r += p.vr;
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.r);
        ctx.fillStyle = p.c;
        ctx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2);
        ctx.restore();
      });
      if (t - start < 2200) requestAnimationFrame(frame);
      else ctx.clearRect(0, 0, w, h);
    })(start);
  }

  // ── Actions ─────────────────────────────────────────────────────────
  let reviewSeq = 0;
  function act(a) {
    const i = a.indexOf(':');
    const name = i < 0 ? a : a.slice(0, i);
    const arg = i < 0 ? '' : a.slice(i + 1);
    switch (name) {
      case 'invite':
        S.invite = arg;
        toast(arg === 'yes' ? '已加入「迎新晚会筹备」，记得去选任务包' : '已拒绝邀请');
        break;
      case 'eng':
        S.eng = 'grace';
        toast('ENG101 已结束。大家有 14 天下载贡献报告');
        break;
      case 'fab':
      case 'sheet':
        sheetReturn = document.activeElement;
        openSheet(name === 'fab' ? 'fab' : arg);
        return;
      case 'open':
        S.task = arg;
        go('task');
        return;
      case 'mytab': S.myTasksTab = arg; break;
      case 'nf': S.notifFilter = arg; break;
      case 'swap': {
        const req = S.swapReq;
        if (arg === 'yes') {
          S.mkt[req.toPkg] = 'ah';
          S.mkt[req.fromPkg] = 'me';
          req.status = 'yes';
          toast(`互换好了！任务包 ${req.fromPkg + 1} 是你的了`);
        } else {
          req.status = 'no';
          toast('已拒绝互换');
        }
        break;
      }
      case 'rank':
        S.projTab = 'rank';
        S.stack.push('project');
        render(true);
        return;
      case 'ptab': S.projTab = arg; break;
      case 'pkgtoggle': S.openPkgs[arg] = !S.openPkgs[arg]; break;
      case 'pick': {
        const idx = Number(arg);
        const prev = myMktPkg();
        if (prev >= 0) S.mkt[prev] = null;
        S.mkt[idx] = 'me';
        // Ahmad asks to swap right after your first pick; switching away later voids that request.
        if (!S.swapReq && S.mkt[4] === 'ah') S.swapReq = { fromPkg: 4, toPkg: idx, status: 'pending' };
        else if (S.swapReq?.status === 'pending') S.swapReq.status = 'void';
        render(false);
        confetti();
        toast(prev >= 0 ? `换好了，现在任务包 ${idx + 1} 是你的` : `🎉 任务包 ${idx + 1} 是你的了！`);
        return;
      }
      case 'ev': S.ev[S.task] = arg === 'none' ? null : arg; break;
      case 'oc': S.outcome = arg; break;
      case 'submit': {
        const id = S.task;
        const seq = ++reviewSeq;
        S.rv[id] = 'reviewing';
        render(false);
        setTimeout(() => {
          if (seq !== reviewSeq) return;
          const t = T[id];
          const o = S.outcome;
          t.ai = DEMO_REASONS[t.k === 'code' ? 'code' : 'file'][o];
          t.status = o === '拿一半' ? 'half' : o === '不通过' ? 'fail' : 'done';
          if (t.status === 'done') t.grade = o;
          delete S.rv[id];
          if (route() === 'task' && S.task === id) render(false);
          if (t.status === 'done') { confetti(); toast(`任务完成！+${t.pts} 分`); }
          else toast(t.status === 'half' ? `AI：拿一半，先拿 ${fmt(t.pts / 2)} 分` : 'AI：不通过，改好可以重交');
        }, reduceMotion ? 300 : 1800);
        return;
      }
      case 'resubmit':
        T[S.task].status = 'doing';
        S.ev[S.task] = null;
        break;
      case 'override': {
        const t = T[S.task];
        t.status = 'done';
        t.grade = '组长判定通过';
        toast(ownerOf(S.task) === 'me' ? `已推翻 AI 判断，你拿满 ${t.pts} 分，全组看得到` : `已推翻 AI 判断，${P[ownerOf(S.task)].n}拿满 ${t.pts} 分`);
        break;
      }
      case 'markdone': {
        const t = T[S.task];
        t.status = 'done';
        t.grade = '自己标记';
        render(false);
        confetti();
        toast(`完成！+${t.pts} 分`);
        return;
      }
      case 'theme':
        S.theme = arg;
        if (arg === 'system') document.documentElement.removeAttribute('data-theme');
        else document.documentElement.setAttribute('data-theme', arg);
        break;
      case 'tg': S[arg] = !S[arg]; break;
      case 'toast':
        closeSheet(false);
        toast(arg);
        return;
      case 'ntab': S.newTab = arg; break;
      case 'ai': S.aiProvider = arg; break;
      case 'nokey': S.noKey = !S.noKey; break;
      case 'team': S.team = Math.min(8, Math.max(2, S.team + Number(arg))); break;
      case 'ctype': S.choiceType = arg; break;
      case 'choice': S.choices[arg] = !S.choices[arg]; break;
      case 'method': S.method = arg; break;
      case 'confirm-choice':
        S.plan = clonePlan(S.choiceType === 'method' ? PLAN_AGILE : PLAN_PICK);
        go('new5');
        return;
      case 'pdel': {
        const [wi, ti] = arg.split('.').map(Number);
        S.plan[wi].tasks.splice(ti, 1);
        break;
      }
      case 'padd': S.plan[Number(arg)].tasks.push(['新任务', 3, '10/1']); break;
      case 'mdel': S.manual.splice(Number(arg), 1); break;
      case 'madd': S.manual.push({ t: '新任务', p: 10 }); break;
      case 'exitflow': S.stack = ['home']; render(true); return;
      case 'topick': S.stack = ['home', 'pick']; render(true); return;
      default: return;
    }
    render(false);
  }

  const closeMap = () => {
    $('#map').classList.remove('open');
    $('#mapFab').setAttribute('aria-expanded', 'false');
  };
  document.addEventListener('click', (e) => {
    if (e.target.closest('#mapClose')) return closeMap();
    const el = e.target.closest('[data-go],[data-back],[data-act]');
    if (!el) {
      if (e.target.id === 'sheet') closeSheet();
      return;
    }
    if (el.closest('#map')) closeMap();
    const actName = el.getAttribute('data-act') || '';
    if (el.closest('#sheet') && !actName.startsWith('toast:')) closeSheet(false);
    if (el.hasAttribute('data-back')) return back();
    const g = el.getAttribute('data-go');
    if (g === 'rank') {
      S.projTab = 'rank';
      S.stack = ['home', 'project'];
      return render(true);
    }
    if (g === 'project') S.projTab = 'pkgs';
    if (g) return go(g);
    act(actName);
  });
  $('#mapFab').addEventListener('click', () => {
    const open = $('#map').classList.toggle('open');
    $('#mapFab').setAttribute('aria-expanded', String(open));
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      closeSheet();
      closeMap();
    }
  });

  render(true);
})();
</script>
</body>
</html>
