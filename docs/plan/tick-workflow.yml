# Move to .github/workflows/tick.yml at deployment (Phase D2). Pushing workflow files needs a token with the `workflow` scope: `gh auth refresh -s workflow`.
# The reminders tick (M5, server/src/services/tick.ts): calls POST /api/internal/tick every 10 minutes.
# Needs two repository secrets (Settings → Secrets and variables → Actions):
#   TICK_URL     e.g. https://<your-api>.vercel.app/api/internal/tick
#   CRON_SECRET  the same value as the API's CRON_SECRET environment variable
# Until both are set (before the API is deployed, Phase D) every run just says so and succeeds.
# GitHub may start scheduled runs a few minutes late; the tick doesn't mind.
name: Reminders tick

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: reminders-tick
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call the tick endpoint
        env:
          TICK_URL: ${{ secrets.TICK_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$TICK_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "TICK_URL or CRON_SECRET is not set: skipping (nothing is deployed yet)."
            exit 0
          fi
          curl --fail-with-body --silent --show-error --max-time 120 \
            --retry 2 --retry-delay 10 --retry-all-errors \
            -X POST -H "Authorization: Bearer $CRON_SECRET" "$TICK_URL"
          echo
